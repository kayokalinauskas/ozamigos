<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ozamigos Share</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <h1>Ozamigos Share</h1>
    <p id="aviso"></p>

    <form id="entrada">
      <p>Sala <strong id="codigo-sala"></strong></p>
      <p>
        <label for="nome">Seu nome</label>
        <input id="nome" maxlength="20" autocomplete="nickname" required>
      </p>
      <p>
        <label for="senha">Senha do grupo</label>
        <input id="senha" type="password" autocomplete="current-password" required>
        <button id="botao-entrar">Entrar</button>
      </p>
    </form>

    <section id="sala" hidden>
      <p>
        Mande este link para os amigos: <code id="link-sala"></code>
        <button id="botao-copiar">Copiar</button>
      </p>
      <p id="pessoas"></p>
      <p>
        <button id="botao-aplicativo">Compartilhar um aplicativo</button>
        <button id="botao-tela">Compartilhar a tela inteira</button>
        <button id="botao-parar" hidden>Parar</button>
        <label for="qualidade" class="rotulo-qualidade">Qualidade</label>
        <select id="qualidade">
          <option value="maxima">1080p a 60 fps (~8 Mbps por amigo)</option>
          <option value="nitida">1080p a 30 fps (~5 Mbps por amigo)</option>
          <option value="equilibrada">720p a 60 fps (~5 Mbps por amigo)</option>
          <option value="leve">720p a 30 fps (~3 Mbps por amigo)</option>
        </select>
      </p>
      <p id="fonte"></p>
      <p class="dica">
        Todos podem compartilhar ao mesmo tempo. Jogo em tela cheia aparecendo preto? Use o modo "janela sem bordas"
        ou compartilhe a tela inteira. Para levar o som do jogo, compartilhe a tela inteira e marque "Compartilhar áudio do sistema".
      </p>
      <div id="videos"></div>
      <pre id="estatisticas"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
