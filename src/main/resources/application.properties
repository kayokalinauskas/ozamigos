spring.application.name=ozamigos-share

# Na nuvem, a porta vem da variável de ambiente PORT; no seu computador, 8080.
server.port=${PORT:8080}

# Atrás do proxy HTTPS do Render, o Spring precisa ler os cabeçalhos X-Forwarded-*
# para saber que a página veio por https (senão a checagem de origem do WebSocket recusa).
server.forward-headers-strategy=framework


# A chave da API de dados do YouTube, para as prévias de links do chat (PreviasDeLinks). Opcional: sem ela, o YouTube
# vai pelo oEmbed e pela página do vídeo, que ele às vezes recusa a servidores. Também só numa variável de ambiente.
ozamigos.youtube.chave=${YOUTUBE_API_KEY:}

# A retransmissão (TURN da Cloudflare) para quem não conecta direto: o id e o token da chave do TURN, o id da conta e um
# token só de leitura das estatísticas (Account Analytics: Read), que o servidor usa para não passar da franquia
# gratuita (Retransmissao). Sem as quatro, ela fica desligada. Só em variáveis de ambiente.
ozamigos.turn.id=${OZAMIGOS_TURN_ID:}
ozamigos.turn.token=${OZAMIGOS_TURN_TOKEN:}
ozamigos.cloudflare.conta=${OZAMIGOS_CLOUDFLARE_CONTA:}
ozamigos.cloudflare.leitura=${OZAMIGOS_CLOUDFLARE_LEITURA:}

# O banco (PostgreSQL), para contas e servidores salvos. Opcional: sem a URL (jdbc:postgresql://...), o servidor sobe
# sem ele (Banco). Só em variáveis de ambiente. A fonte de dados é montada pelo Banco, não pelo Spring.
ozamigos.banco.url=${OZAMIGOS_BANCO_URL:}
ozamigos.banco.usuario=${OZAMIGOS_BANCO_USUARIO:}
ozamigos.banco.senha=${OZAMIGOS_BANCO_SENHA:}

# O login (docs/plano-contas.md): os clientes OAuth do Google e do Discord. Cada um só liga com o id e o segredo, e o
# login só funciona com o banco. Só em variáveis de ambiente. OZAMIGOS_GOOGLE_EMISSOR é só para testes (ProvedoresDeLogin).
ozamigos.google.id=${OZAMIGOS_GOOGLE_ID:}
ozamigos.google.segredo=${OZAMIGOS_GOOGLE_SEGREDO:}
ozamigos.google.emissor=${OZAMIGOS_GOOGLE_EMISSOR:}
ozamigos.discord.id=${OZAMIGOS_DISCORD_ID:}
ozamigos.discord.segredo=${OZAMIGOS_DISCORD_SEGREDO:}

# A fonte de dados é do Banco, e os provedores do login são montados pelo ProvedoresDeLogin (o Spring recusaria subir
# sem eles); sem o UserDetailsService, o Spring Security não cria um usuário com senha aleatória que ninguém usa.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,  org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration,  org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

# A sessão HTTP só existe durante a ida ao provedor do login (Login, AoEntrar); a da conta é outra (Sessoes).
server.servlet.session.timeout=10m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# A interface é sempre conferida com o servidor, para um deploy novo aparecer na hora.
# Sem a data de modificação: o jar data tudo de 1980, e o navegador guardaria a página por anos.
# Os arquivos de /assets (com hash no nome) têm regra própria, em CacheConfig.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=false

# Verificação de saúde para o Render (Health Check Path: /actuator/health). Só ela fica exposta,
# e sem detalhes: quem olha de fora vê só o status ("UP"), nada do disco, da memória ou da configuração.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# A saúde é só a do servidor: com o banco fora do ar, as salas continuam funcionando, e o Render não pode achar que o
# servidor caiu (nem o app ficar em "Conectando...").
management.health.db.enabled=false
