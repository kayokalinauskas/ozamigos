<style>
  @font-face { font-family: 'Sora'; font-weight: 100 800; src: url('../../desktop/build/sora.woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../../web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); }
  html, body { margin: 0; background: transparent; }

  /* O logotipo: a tecla do ícone, com "oz" do tamanho de "amigos", que vem logo depois. */
  .logo { display: inline-block; padding: 6px; font-family: 'Sora'; font-weight: 600; font-size: 96px; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  /* A base do "oz" na base de "amigos" (a mesma regra de web/src/estilo.css). */
  .tecla-oz { display: inline-block; width: 1.65em; height: 1.65em; margin-right: 0.18em; vertical-align: -0.641em; }
  /* Tema escuro do GitHub: texto claro. */
  .tema-escuro .resto { color: #eef5e4; }
  /* Tema claro: texto quase preto. */
  .tema-claro .resto { color: #0f130e; }

  /* Prévia de link (1280x640): logotipo, frase e um pedaço da sala. */
  .social { position: relative; overflow: hidden; width: 1280px; height: 640px; border-radius: 28px;
    background: radial-gradient(700px 420px at 8% 0%, rgb(182 242 74 / 0.16), transparent 70%), #0b0e0a;
    font-family: 'Inter', sans-serif; color: #eef5e4; }
  .social .logo { position: absolute; left: 58px; top: 64px; font-size: 84px; }
  .social .frase { position: absolute; left: 64px; top: 230px; margin: 0; font-size: 27px; line-height: 1.4; color: #c9d4bb; }
  .social .frase strong { color: #eef5e4; font-weight: 600; }
  .social .print { position: absolute; left: 620px; top: 375px; width: 760px; border-radius: 16px; border: 1px solid #3b4835; }
  [hidden] { display: none !important; }
</style>
