<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Sora'; font-weight: 100 800; src: url('../../desktop/build/sora.woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../../web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); }
  html, body { margin: 0; background: transparent; }

  /* O logotipo: a tecla "Oz" do ícone (o mesmo desenho), seguida de "amigos". */
  .logo { display: inline-flex; align-items: center; padding: 6px; font-family: 'Sora'; font-weight: 600; font-size: 96px; letter-spacing: -0.02em; line-height: 1; }
  .tecla-oz { flex: none; width: 1.5em; height: 1.48em; margin-right: 0.16em; }
  /* Tema escuro do GitHub: texto claro. */
  .tema-escuro .resto { color: #eef5e4; }
  /* Tema claro: texto quase preto. */
  .tema-claro .resto { color: #0f130e; }

  /* Prévia de link (1280x640): logotipo, frase e um pedaço da sala. */
  .social { position: relative; overflow: hidden; width: 1280px; height: 640px; border-radius: 28px;
    background: radial-gradient(700px 420px at 8% 0%, rgb(182 242 74 / 0.16), transparent 70%), #0b0e0a;
    font-family: 'Inter', sans-serif; color: #eef5e4; }
  .social .logo { position: absolute; left: 58px; top: 64px; font-size: 84px; }
  .social .frase { position: absolute; left: 64px; top: 230px; margin: 0; font-size: 27px; line-height: 1.4; color: #c9d4bb; }
  .social .frase strong { color: #eef5e4; font-weight: 600; }
  .social .print { position: absolute; left: 620px; top: 375px; width: 760px; border-radius: 16px; border: 1px solid #3b4835; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="logo" class="logo" hidden><svg class="tecla-oz" viewBox="4 5 88 87" aria-hidden="true"><rect x="4" y="5" width="88" height="87" rx="20" fill="#b6f24a"/><rect x="9" y="8" width="78" height="70" rx="16" fill="#2a3326"/><ellipse cx="37.6" cy="41.7" rx="15" ry="17.5" fill="none" stroke="#eef9dc" stroke-width="8.5"/><path d="M61 52h15.6L61 66.4h15.6" fill="none" stroke="#b6f24a" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="resto">amigos</span></div>
  <div id="social" class="social tema-escuro" hidden>
    <div class="logo"><svg class="tecla-oz" viewBox="4 5 88 87" aria-hidden="true"><rect x="4" y="5" width="88" height="87" rx="20" fill="#b6f24a"/><rect x="9" y="8" width="78" height="70" rx="16" fill="#2a3326"/><ellipse cx="37.6" cy="41.7" rx="15" ry="17.5" fill="none" stroke="#eef9dc" stroke-width="8.5"/><path d="M61 52h15.6L61 66.4h15.6" fill="none" stroke="#b6f24a" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="resto">amigos</span></div>
    <p class="frase">Transmita seu jogo para os amigos.<br><strong>Direto de um PC para o outro, em até 1080p.</strong></p>
    <img class="print" src="../imagens/sala-grade.png" alt="">
  </div>
  <script>
    const modo = new URLSearchParams(location.search).get('modo');
    if (modo === 'social') {
      document.getElementById('social').hidden = false;
    } else {
      document.getElementById('logo').hidden = false;
      document.body.classList.add(modo);
    }
  </script>
</body>
</html>
