<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Sora'; font-weight: 100 800; src: url('../../desktop/build/sora.woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../../web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2'); }
  html, body { margin: 0; background: transparent; }
  .capa {
    position: relative; overflow: hidden; box-sizing: border-box;
    width: 1280px; height: 400px; border-radius: 28px;
    background:
      radial-gradient(700px 420px at 8% 0%, rgb(182 242 74 / 0.16), transparent 70%),
      radial-gradient(600px 400px at 100% 100%, rgb(182 242 74 / 0.08), transparent 70%),
      #0b0e0a;
    border: 1px solid #2a3326;
    font-family: 'Inter', sans-serif; color: #eef5e4;
  }
  .social .capa { height: 640px; }
  .texto { position: absolute; left: 64px; top: 72px; width: 600px; }
  .social .texto { top: 70px; width: 1150px; }
  .logo { display: flex; align-items: center; font-family: 'Sora'; font-weight: 600; font-size: 84px; letter-spacing: -0.02em; line-height: 1; }
  .tecla { display: inline-grid; place-items: center; min-width: 1.2em; height: 1.3em; margin-right: 0.12em; padding: 0 0.14em; border-bottom: 0.14em solid #b6f24a; border-radius: 0.26em; background: #1f261c; letter-spacing: 0; }
  .frase { margin: 30px 0 0; font-size: 27px; line-height: 1.4; color: #c9d4bb; }
  .frase strong { color: #eef5e4; font-weight: 600; }
  .selos { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .selo { padding: 7px 14px; border: 1px solid #3b4835; border-radius: 999px; font-size: 16px; color: #d9e3cc; background: rgb(31 38 28 / 0.7); }
  .selo b { color: #b6f24a; font-weight: 600; }
  .print {
    position: absolute; left: 720px; top: 56px; width: 760px; border-radius: 16px;
    border: 1px solid #3b4835; box-shadow: 0 30px 80px rgb(0 0 0 / 0.6);
  }
  .social .print { left: 620px; top: 375px; width: 760px; }
</style>
</head>
<body>
  <div class="capa">
    <div class="texto">
      <div class="logo"><span class="tecla">O</span><span class="tecla">Z</span><span>amigos</span></div>
      <p class="frase">Transmita seu jogo para os amigos.<br><strong>Direto de um PC para o outro, em até 1080p.</strong></p>
      <div class="selos">
        <span class="selo"><b>P2P</b> por WebRTC</span>
        <span class="selo">Até <b>5</b> por sala</span>
        <span class="selo">Som <b>sem eco</b> do Discord</span>
      </div>
    </div>
    <img class="print" src="../imagens/sala-grade.png" alt="">
  </div>
  <script>if (location.search.includes('social')) document.body.classList.add('social');</script>
</body>
</html>
