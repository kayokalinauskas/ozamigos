# O Dependabot abre pull requests quando sai versão nova das dependências.
# Uma vez por semana, com as atualizações pequenas agrupadas num PR só para não lotar a lista.
# Correções de segurança chegam na hora, fora do agendamento.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: nuget # o auxiliar de som
    directory: /desktop/som
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
