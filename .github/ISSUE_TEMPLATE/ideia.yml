name: Ideia
description: Sugira um recurso ou uma melhoria
labels: ['ideia']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
      description: Conte a situação em que você sentiu falta disso.
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: Como você imagina
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
