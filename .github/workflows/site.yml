# Publica a pasta site/ no GitHub Pages: https://kayokalinauskas.github.io/ozamigos/
# O site é estático (HTML, CSS e um script pequeno), sem build. Só roda quando site/ muda.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # nunca duas publicações ao mesmo tempo; a mais nova vence
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      # O Pages deixa o navegador guardar cada arquivo por 10 min. Sem isto, uma página guardada podia
      # abrir com o CSS novo (de outra página) e quebrar o layout. Com a versão no endereço, cada HTML
      # pede exatamente o CSS e o script com que foi publicado. A versão é o hash do conteúdo: se
      # nada mudou, o cache continua valendo.
      - name: Versionar o CSS e o script nas páginas
        run: |
          versao=$(cat site/estilo.css site/site.js | sha256sum | cut -c1-10)
          find site -name '*.html' -exec sed -i -E "s/(estilo\.css|site\.js)\"/\1?v=$versao\"/g" {} +
          grep -rhoE '(estilo\.css|site\.js)\?v=[0-9a-f]+' site --include='*.html' | sort | uniq -c
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v4
